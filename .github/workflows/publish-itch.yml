name: Publish to itch.io

# Publish only after CI has passed for a push to main, so a failing lint, test,
# or build never reaches itch.io.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-itch
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: procuniverse

jobs:
  publish:
    name: Build & publish
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: procuniverse

      - uses: ./procuniverse/.github/actions/setup

      - run: npm run build

      - name: Setup butler
        uses: remarkablegames/setup-butler@v3

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push dist corniflex/procuniverse:html5
